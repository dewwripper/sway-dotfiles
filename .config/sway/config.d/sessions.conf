# Session environment & D-Bus activation for portals
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP XMODIFIERS GTK_IM_MODULE QT_IM_MODULE SHELL

# Twingate notifier exits if started before DISPLAY is in the systemd env; (re)start it after the import
exec sleep 2 && systemctl --user restart twingate-desktop-notifier
